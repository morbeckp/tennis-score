<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tênis Score" />
  <title>Placar de Tênis</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="portraitBlocker">
    <div>
      <strong>Gire o iPhone</strong>
      <span>Este app foi desenhado para modo paisagem.</span>
    </div>
  </div>

  <main class="app">
    <section id="setupScreen" class="setup-screen">
      <div class="setup-card">
        <h1>Configurar partida</h1>

        <div class="setup-grid">
          <label>Jogador 1<input id="p1" value="Jogador 1" /></label>
          <label>Jogador 2<input id="p2" value="Jogador 2" /></label>

          <label>Regra de vantagem
            <select id="advantage">
              <option value="true">Com vantagem</option>
              <option value="false">Sem vantagem / No-Ad</option>
            </select>
          </label>

          <label>Games por set
            <select id="gamesPerSet">
              <option value="4">4 games</option>
              <option value="6" selected>6 games</option>
            </select>
          </label>

          <label>Sets para vencer
            <select id="setsToWin">
              <option value="1">1 set</option>
              <option value="2" selected>Melhor de 3</option>
              <option value="3">Melhor de 5</option>
            </select>
          </label>

          <label>Sacador inicial
            <select id="firstServer">
              <option value="0">Jogador 1</option>
              <option value="1">Jogador 2</option>
            </select>
          </label>
        </div>

        <button class="primary" onclick="startMatch()">Iniciar partida</button>
      </div>
    </section>

    <section id="matchScreen" class="match-screen hidden">
      <header class="match-header">
        <div>
          <div id="setInfo" class="set-info">Set 1 · Game 1</div>
          <div id="serverInfo" class="server-info">Sacando: -</div>
        </div>

        <div class="header-actions">
          <button class="secondary small" onclick="undo()">Desfazer</button>
          <button class="secondary small" onclick="copyStats()">Copiar estatísticas</button>
          <button class="danger small" onclick="newMatch()">Nova</button>
        </div>
      </header>

      <section class="landscape-board">
        <article id="playerCard0" class="player-panel">
          <div class="player-top">
            <div id="serverBadge0" class="server-badge"></div>
            <h2 id="name0">Jogador 1</h2>
          </div>
          <div class="player-numbers">
            <div><span>Sets</span><strong id="sets0">0</strong></div>
            <div><span>Games</span><strong id="games0">0</strong></div>
            <div><span>Pontos</span><strong id="points0">0</strong></div>
          </div>
          <button class="point-btn" onclick="openPointOverlay(0)">Ponto</button>
        </article>

        <section class="center-panel">
          <div id="matchStatus" class="match-status">Partida em andamento</div>
          <div class="central-score">
            <span id="centralPoint0">0</span>
            <span class="dash">×</span>
            <span id="centralPoint1">0</span>
          </div>
          <div id="ruleInfo" class="rule-info"></div>
          <div class="mini-history">
            <h3>Últimos games</h3>
            <div id="gamesHistory"></div>
          </div>
        </section>

        <article id="playerCard1" class="player-panel">
          <div class="player-top">
            <div id="serverBadge1" class="server-badge"></div>
            <h2 id="name1">Jogador 2</h2>
          </div>
          <div class="player-numbers">
            <div><span>Sets</span><strong id="sets1">0</strong></div>
            <div><span>Games</span><strong id="games1">0</strong></div>
            <div><span>Pontos</span><strong id="points1">0</strong></div>
          </div>
          <button class="point-btn" onclick="openPointOverlay(1)">Ponto</button>
        </article>
      </section>
    </section>

    <section id="pointOverlay" class="point-overlay hidden" aria-modal="true">
      <div class="overlay-panel">
        <div class="overlay-header">
          <div>
            <h2 id="overlayTitle">Ponto para</h2>
            <p id="overlayContext">Sacador: -</p>
          </div>
          <button class="secondary close-btn" onclick="closePointOverlay()">Cancelar</button>
        </div>
        <div id="classificationButtons" class="classification-grid"></div>
        <div class="overlay-footer">
          <button id="repeatLastBtn" class="secondary" onclick="classifyPoint('__repeat__')">Repetir último tipo</button>
          <button class="secondary" onclick="classifyPoint('unclassified')">Registrar sem classificar</button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
